<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="yno labs">
<title>yno labs</title>
<link rel="icon" type="image/svg+xml" href="icons/dashboard.svg">
<style>
:root{--bg:#e4e4e4;--surface:#f7f7f7;--ink:#111;--mute:#6f6f6f;--line:#b9b9b9;--primary:#ff6a1a;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#17171a;--surface:#1f1f23;--ink:#ececec;--mute:#8d8d95;--line:#3a3a41}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--mono);
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:640px;margin:0 auto;padding:20px 16px 32px}
h1{margin:0;font-size:34px;line-height:1.1}h1 span{color:var(--primary)}
main>p{margin:6px 0 20px;color:var(--mute);font-size:13px}
.card{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:12px;min-height:72px;
background:var(--surface);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none}
.card:active{border-color:var(--primary)}
.card img,.em{flex:none;width:44px;height:44px;font-size:32px;line-height:44px;text-align:center}
.card small{display:block;color:var(--mute);font-size:11px}.card b{display:block}
.card p{margin:2px 0 0;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
<h1>yno<span>.</span>labs</h1>
<p>3 apps online</p>
<a class="card" href="https://davidlamlyy-blip.github.io/cadet-study/"><img src="icons/cadet.svg" alt="" width="44" height="44">
<div><small>Cadet</small><b>Cadet 學習站</b>
<p>Flash card、Learn、地圖、動畫、測驗</p></div></a>
<a class="card" href="https://davidlamlyy-blip.github.io/my-web-apps/power/"><img src="icons/power-app.svg" alt="" width="44" height="44">
<div><small>Power</small><b>Power 日常 app</b>
<p>體重、食量、筆記（資料存瀏覽器）</p></div></a>
<a class="card" href="https://davidlamlyy-blip.github.io/my-web-apps/dj/"><img src="icons/dj.svg" alt="" width="44" height="44">
<div><small>其他</small><b>DJ-24 Mixer</b>
<p>Web Audio mixer</p></div></a>
</main>
</body>
</html>
